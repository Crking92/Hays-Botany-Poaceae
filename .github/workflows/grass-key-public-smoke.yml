name: Verify live Grass ID key matches main
on:
  push:
    branches: [main]
    paths:
      - 'site/visual-key-lab/species-*.json'
      - 'site/visual-key-lab/hays-candidates.json'
      - 'site/visual-key-lab/provisional-trial-*.json'
      - 'site/visual-key-lab/index.html'
      - 'scripts/smoke_public_grass_key.py'
      - '.github/workflows/grass-key-public-smoke.yml'
  pull_request:
    paths:
      - 'scripts/smoke_public_grass_key.py'
      - '.github/workflows/grass-key-public-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python smoke-test syntax before publication
        run: python3 -m py_compile scripts/smoke_public_grass_key.py
  public-key-parity:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm public Pages HTML and all 112 scored plus 53 unverified trial JSON records match main
        run: python scripts/smoke_public_grass_key.py
