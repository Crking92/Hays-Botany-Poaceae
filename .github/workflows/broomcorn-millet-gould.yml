name: Broomcorn millet Gould comparison
on:
  pull_request:
    paths:
      - 'site/visual-key-lab/index.html'
      - 'site/visual-key-lab/gould-broomcorn-millet-character-supplement.json'
      - 'scripts/test_broomcorn_millet_gould.cjs'
      - '.github/workflows/broomcorn-millet-gould.yml'
  push:
    branches: [main]
    paths:
      - 'site/visual-key-lab/index.html'
      - 'site/visual-key-lab/gould-broomcorn-millet-character-supplement.json'
      - 'scripts/test_broomcorn_millet_gould.cjs'
      - '.github/workflows/broomcorn-millet-gould.yml'
permissions:
  contents: read
jobs:
  broomcorn-millet-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_broomcorn_millet_gould.cjs
      - run: node scripts/test_grass_169_all_option_functionality.cjs
      - run: node scripts/test_grass_three_way_evidence_key.cjs
      - run: node scripts/test_grass_focused_identity_admissions.cjs
      - run: node scripts/test_grass_gould_1975_reference.cjs

