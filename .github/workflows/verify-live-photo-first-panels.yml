name: Verify new Poaceae photo panels and credits on live Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/data/gallery-index.json'
      - 'site/data/poaceae-index.json'
      - 'site/data/species/**'
      - 'site/media/**'
      - '.github/workflows/verify-live-photo-first-panels.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Confirm newly approved photos are actually delivered by Pages
        run: |
          python3 - <<'PY'
          import concurrent.futures,hashlib,json,time,urllib.parse,urllib.request
          from pathlib import Path
          base="https://crking92.github.io/Hays-Botany-Poaceae/site/"
          root=Path("site")
          expected=json.loads((root/"data/gallery-index.json").read_text())
          def fetch(path):
              url=urllib.parse.urljoin(base,path)
              req=urllib.request.Request(url,headers={"User-Agent":"HaysBotanyPoaceaePhotoFirstAudit/1.0"})
              with urllib.request.urlopen(req,timeout=24) as response:
                  assert response.status==200,url
                  return response.read()
          for attempt in range(30):
              try:
                  live_gallery=json.loads(fetch("data/gallery-index.json"))
                  if (live_gallery["species"]==expected["species"]
                      and live_gallery["photo_panels"]>=expected["photo_panels"]
                      and all(live_gallery["entries"].get(sid,{}).get("count",0)>=v["count"]
                              for sid,v in expected["entries"].items())):
                      print("POACEAE_GALLERY_BASELINE_REACHED",
                            expected["photo_panels"],live_gallery["photo_panels"])
                      break
              except Exception as error:
                  print("Pages update pending",str(error))
              time.sleep(8)
          else: raise AssertionError("Public grass gallery did not reach current commit")
          gallery=expected
          index=json.loads((root/"data/poaceae-index.json").read_text())
          assert gallery["species"]==len(index)==112
          paths=[]
          for entry in index:
              sid=entry["id"]
              rel="data/species/"+sid+".json"
              paths.append(rel)
              card=json.loads((root/rel).read_text())
              assert len(card["panels"])==gallery["entries"][sid]["count"]
              for panel in card["panels"]:
                  src=panel.get("src","")
                  if not src.startswith("media/"):continue
                  assert src.startswith("media/"+sid+"/") and (root/src).is_file()
                  assert panel.get("creator") and panel.get("source_page") and panel.get("license")
                  assert not panel.get("private_rights_review_only")
                  if panel.get("noncommercial_only"):
                      assert panel["license"] in {"CC BY-NC 4.0","CC BY-NC-SA 4.0"}
                  else:
                      assert "NC" not in panel["license"].upper()
                  paths.append(src)
          paths+=["data/poaceae-index.json"]
          paths=list(dict.fromkeys(paths))
          def verify(path):
              local=(root/path).read_bytes()
              remote=fetch(path)
              if path.startswith("media/"):
                  assert hashlib.sha256(local).digest()==hashlib.sha256(remote).digest(),path
              elif path.startswith("data/species/"):
                  before=json.loads(local);after=json.loads(remote)
                  assert before["id"]==after["id"],path
                  live_keys={(p.get("src"),p.get("creator"),p.get("license"),p.get("source_page"))
                             for p in after["panels"]}
                  assert all((p.get("src"),p.get("creator"),p.get("license"),p.get("source_page"))
                             in live_keys for p in before["panels"]),path
                  for panel in after["panels"]:
                      if str(panel.get("src","")).startswith("media/"):
                          assert panel.get("creator") and panel.get("source_page") and panel.get("license"),path
              else:
                  before=json.loads(local);after=json.loads(remote)
                  a={e["id"]:e for e in before};b={e["id"]:e for e in after}
                  assert set(a)==set(b) and len(a)==112,path
                  assert all(b[sid]["local_panel_count"]>=v["local_panel_count"] for sid,v in a.items()),path
              return path
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              delivered=list(pool.map(verify,paths))
          assert gallery["photo_panels"]==sum(e["count"] for e in gallery["entries"].values())
          print("POACEAE_LIVE_PHOTO_FIRST_PASS",json.dumps({
              "species":len(index),"panels":gallery["photo_panels"],
              "baseline_photo_and_card_files_verified":len(delivered),
              "live_photo_panels_at_check":live_gallery["photo_panels"]
          }))
          PY

# Poaceae 002 Pages release confirmation: compare the live credited 729+ grass gallery after concurrent publication.
