name: Verify full live Poaceae photo delivery, credits and all 123 Poaceae 002 originals
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-photo-first-panels.yml'
      - 'scripts/verify_live_poaceae_gallery_media.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: poaceae-live-gallery-audit
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Confirm every public photo URL and the 123 exact approved source files
        run: python3 scripts/verify_live_poaceae_gallery_media.py
      - name: Preserve live website audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poaceae-live-site-photo-audit
          path: audit-live-photo-delivery.json
          retention-days: 30
          if-no-files-found: warn
