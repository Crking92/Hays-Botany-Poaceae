name: Hays 58 grass candidates - independent taxonomy screen
on:
  push:
    branches: [inat-coverage-audit-20261111]
    paths:
      - '.github/workflows/hays-58-taxonomic-crosswalk.yml'
      - 'scripts/screen_hays_58_taxonomy.py'
permissions:
  contents: write
jobs:
  name-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Cross-check all 58 names against GBIF backbone
        run: python3 scripts/screen_hays_58_taxonomy.py
      - name: Commit review dossiers only to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/hays-58-botanical-crosswalk.json audits/hays-58-botanical-crosswalk.md
          if ! git diff --cached --quiet; then
            git commit -m "Save Hays 58 independent taxonomy screen and review dossier"
            git push origin HEAD:inat-coverage-audit-20261111
          fi
      - name: Preserve crosswalk outputs
        uses: actions/upload-artifact@v4
        with:
          name: hays-58-botanical-screen
          path: |
            audits/hays-58-botanical-crosswalk.json
            audits/hays-58-botanical-crosswalk.md
          if-no-files-found: error
