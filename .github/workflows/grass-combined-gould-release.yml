name: Combined Gould grass-character release
on:
  pull_request:
    paths:
      - 'site/visual-key-lab/**'
      - 'scripts/test_*gould*.cjs'
      - 'scripts/grass_integrated_test_harness.cjs'
      - '.github/workflows/grass-combined-gould-release.yml'
  push:
    branches: [main]
    paths:
      - 'site/visual-key-lab/**'
      - 'scripts/test_*gould*.cjs'
      - 'scripts/grass_integrated_test_harness.cjs'
      - '.github/workflows/grass-combined-gould-release.yml'
permissions:
  contents: read
jobs:
  combined-characters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test production hydration and every combined option
        run: node scripts/test_grass_combined_gould_release.cjs
      - name: Test all reviewed species independently
        run: |
          for test in scripts/test_{kleingrass_gould_character_mapping,chloris_virgata_gould,goosegrass_gould,big_bluestem_gould,stinkgrass_gould,dichanthium_gould,crowfootgrass_gould,green_sprangletop_gould,hairy_grama_gould,hooded_windmill_gould,silky_bluestem_gould,pampasgrass_gould,canter_windmill_gould,california_cottontop_gould,cane_bluestem_gould,southern_crabgrass_gould,fringed_chloris_gould,broomcorn_millet_gould}.cjs; do
            node "$test" || exit 1
          done
      - name: Preserve inventory, sources, glossary and existing arrows
        run: |
          node scripts/test_grass_169_all_option_functionality.cjs
          node scripts/test_grass_three_way_evidence_key.cjs
          node scripts/test_optional_grass_refinement.cjs
          node scripts/test_grass_gould_1975_reference.cjs
          node scripts/test_grass_glossary.cjs
          node scripts/test_grass_main_question_photo_arrows.cjs

