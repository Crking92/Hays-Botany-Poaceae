name: Hays Paspalum langei - inspect 3 TEX voucher metadata and media links
on:
  push:
    branches: [inat-coverage-audit-20261111]
    paths:
      - '.github/workflows/hays-paspalum-three-tex-details.yml'
      - 'scripts/hays_paspalum_three_tex_details.py'
permissions:
  contents: write
jobs:
  specimens:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Query three exact GBIF occurrence detail and original TEX references
        run: python3 scripts/hays_paspalum_three_tex_details.py
      - name: Save TEX specimen records on review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/hays-paspalum-langei-tex-three-specimen-metadata-20261111.json audits/hays-paspalum-langei-tex-three-specimen-metadata-20261111.md
          if ! git diff --cached --quiet; then
            git commit -m "Record three Hays Paspalum langei TEX specimen metadata and media links"
            git push origin HEAD:inat-coverage-audit-20261111
          fi
      - name: Save report artifact
        uses: actions/upload-artifact@v4
        with:
          name: hays-paspalum-three-tex-metadata
          path: |
            audits/hays-paspalum-langei-tex-three-specimen-metadata-20261111.json
            audits/hays-paspalum-langei-tex-three-specimen-metadata-20261111.md
          if-no-files-found: error
