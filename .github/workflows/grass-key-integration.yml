name: Hays Grass Lab combined scoring regression
on:
  push:
    branches: [main]
    paths:
      - 'site/visual-key-lab/species-*.json'
      - 'site/visual-key-lab/hays-candidates.json'
      - 'site/visual-key-lab/index.html'
      - 'scripts/test_grass_key_integration.cjs'
      - 'scripts/test_grass_field_rules.cjs'
      - 'scripts/test_grass_score_deltas.cjs'
      - 'scripts/test_grass_sprint_lane_b.cjs'
      - 'scripts/test_scoring_lane_a.cjs'
      - 'scripts/test_lane_c_batch*.cjs'
      - '.github/workflows/grass-key-integration.yml'
  pull_request:
    paths:
      - 'site/visual-key-lab/species-*.json'
      - 'site/visual-key-lab/hays-candidates.json'
      - 'site/visual-key-lab/index.html'
      - 'scripts/test_grass_key_integration.cjs'
      - 'scripts/test_grass_field_rules.cjs'
      - 'scripts/test_grass_score_deltas.cjs'
      - 'scripts/test_grass_sprint_lane_b.cjs'
      - 'scripts/test_scoring_lane_a.cjs'
      - 'scripts/test_lane_c_batch*.cjs'
      - '.github/workflows/grass-key-integration.yml'
jobs:
  integrated-field-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check live filter, false exclusions and 112/57 admission boundary
        run: node scripts/test_grass_key_integration.cjs
      - name: Execute Lane B production-filter regressions
        run: node scripts/test_grass_sprint_lane_b.cjs
      - name: Execute Lane A paths if Lane A has landed
        run: if [ -f scripts/test_scoring_lane_a.cjs ]; then node scripts/test_scoring_lane_a.cjs; fi
      - name: Reject lost valid scoring states and protected photo/credit changes
        run: node scripts/test_grass_score_deltas.cjs
      - name: Guard crew field instructions against newly broken joins and truncations
        run: node scripts/test_grass_field_rules.cjs
      - name: Execute Lane C Batch 5 self-contained real-filter regressions
        run: node scripts/test_lane_c_batch5.cjs
      - name: Validate Lane C regression script syntax (baseline histories checked separately)
        run: node --check scripts/test_lane_c_batch1.cjs && node --check scripts/test_lane_c_batch2.cjs && node --check scripts/test_lane_c_batch3.cjs && node --check scripts/test_lane_c_batch5.cjs
