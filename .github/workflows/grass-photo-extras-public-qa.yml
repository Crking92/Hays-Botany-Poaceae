name: Grass Lab archived photo extras — real public Pages pixels and credits
on:
  pull_request:
    paths:
      - 'site/visual-key-lab/index.html'
      - 'site/visual-key-lab/photo-general-archive-extras.json'
      - 'scripts/verify_live_grass_photo_extras.py'
      - '.github/workflows/grass-photo-extras-public-qa.yml'
  push:
    branches: [main]
    paths:
      - 'site/visual-key-lab/index.html'
      - 'site/visual-key-lab/photo-general-archive-extras.json'
      - 'scripts/verify_live_grass_photo_extras.py'
      - '.github/workflows/grass-photo-extras-public-qa.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  archive-source-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check validator syntax
        run: python3 -m py_compile scripts/verify_live_grass_photo_extras.py
      - name: Verify original archive photo bytes, individual credits, and untouched scored shards
        run: python3 scripts/verify_live_grass_photo_extras.py --local-only
  public-visible-photo-galleries:
    needs: archive-source-integrity
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser for real desktop/mobile photo visibility QA
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Verify live Pages manifest, exact JPEG bytes, and displayed creator/rights links for each photo
        run: python3 scripts/verify_live_grass_photo_extras.py
