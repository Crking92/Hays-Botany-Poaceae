name: Poaceae browser desktop and mobile preview gate (NO deployment)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/poaceae-browser-smoke.yml"
      - "scripts/smoke_poaceae_preview.py"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install headless Chromium
        run: |
          python -m pip install "playwright>=1.53,<2"
          python -m playwright install --with-deps chromium
      - name: Generate unpublished Poaceae staging preview
        run: python scripts/build_poaceae_site_preview.py
      - name: Start localhost-only preview and validate desktop/mobile interactions
        run: |
          mkdir -p qa-report
          python -m http.server 8765 --directory dist > /tmp/poaceae-preview-http.log 2>&1 &
          echo $! > /tmp/poaceae-preview-server.pid
          sleep 2
          POACEAE_TEST_URL=http://127.0.0.1:8765 python scripts/smoke_poaceae_preview.py
      - name: Upload screenshots and result report only; never release site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poaceae-localhost-browser-checks
          path: qa-report/
          retention-days: 14
          if-no-files-found: warn
