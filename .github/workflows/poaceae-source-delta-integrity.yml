name: Poaceae source-delta integrity (no photo release)
on:
  push:
    branches: [main]
    paths:
      - 'migration/documented-post-import-source-deltas-20261112.json'
      - 'scripts/poaceae_source_delta_integrity.py'
      - 'scripts/test_poaceae_source_deltas.py'
      - '.github/workflows/poaceae-source-delta-integrity.yml'
  pull_request:
    paths:
      - 'migration/documented-post-import-source-deltas-20261112.json'
      - 'scripts/poaceae_source_delta_integrity.py'
      - 'scripts/test_poaceae_source_deltas.py'
      - '.github/workflows/poaceae-source-delta-integrity.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  reviewed-source-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify both original/current blob identities and eight fail-closed controls
        run: python scripts/test_poaceae_source_deltas.py
