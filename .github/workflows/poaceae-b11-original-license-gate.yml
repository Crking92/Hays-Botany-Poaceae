name: Poaceae B11 source-photo original/license gate (temporary)
on:
  pull_request:
    paths:
      - 'scripts/poaceae_b11_original_license_gate.py'
      - '.github/workflows/poaceae-b11-original-license-gate.yml'
  workflow_dispatch:
jobs:
  source-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - run: python scripts/poaceae_b11_original_license_gate.py
