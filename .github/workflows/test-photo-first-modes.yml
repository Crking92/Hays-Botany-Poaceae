name: Test November 2 photo-first and NC approval gates
on:
  push:
    branches: [main]
    paths:
      - 'scripts/publish_approved_family_photos.py'
      - 'scripts/publish_approved_grass_photos.py'
      - 'scripts/test_photo_first_modes.py'
      - '.github/workflows/test-photo-first-modes.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  evidence-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: python3 scripts/test_photo_first_modes.py
