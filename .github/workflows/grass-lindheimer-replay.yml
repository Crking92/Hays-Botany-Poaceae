name: Lindheimer exact field replay — fast read-only browser
on:
  pull_request:
    paths:
      - 'scripts/replay_lindheimers_muhly_20261119.py'
      - '.github/workflows/grass-lindheimer-replay.yml'
      - 'site/visual-key-lab/index.html'
      - 'site/visual-key-lab/species-*.json'
      - 'site/visual-key-lab/source-reference-gould-1975.json'
      - 'site/visual-key-lab/hays-candidates.json'
      - 'site/visual-key-lab/optional-refinement-evidence.json'
  push:
    branches: [main]
    paths:
      - 'scripts/replay_lindheimers_muhly_20261119.py'
      - '.github/workflows/grass-lindheimer-replay.yml'
      - 'site/visual-key-lab/index.html'
      - 'site/visual-key-lab/species-*.json'
      - 'site/visual-key-lab/source-reference-gould-1975.json'
      - 'site/visual-key-lab/hays-candidates.json'
      - 'site/visual-key-lab/optional-refinement-evidence.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python browser bindings, use runner system Chrome
        run: python -m pip install 'playwright>=1.53,<2'
      - name: Replay field choices and list remaining possibilities
        env:
          HAYS_GRASS_TEST_URL: 'http://127.0.0.1:8772/site/visual-key-lab/index.html'
          HAYS_GRASS_BROWSER_CHANNEL: chrome
        run: |
          python -m http.server 8772 --directory . >/tmp/lindheimer-replay-http.log 2>&1 &
          sleep 2
          python scripts/replay_lindheimers_muhly_20261119.py
      - name: Verify published page HTML equals main before reporting
        if: github.event_name == 'push'
        run: python -c 'from scripts.smoke_grass_key_visitor_browser import published_html_parity; published_html_parity()'
      - name: Independently replay current public GitHub Pages results
        env:
          HAYS_GRASS_TEST_URL: 'https://crking92.github.io/Hays-Botany-Poaceae/site/visual-key-lab/index.html'
          HAYS_GRASS_BROWSER_CHANNEL: chrome
        run: python scripts/replay_lindheimers_muhly_20261119.py
