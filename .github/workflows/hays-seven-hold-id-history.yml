name: Hays 7 photo-access holds - source ID history audit
on:
  push:
    branches: [inat-coverage-audit-20261111]
    paths:
      - '.github/workflows/hays-seven-hold-id-history.yml'
      - 'scripts/hays_seven_source_id_history.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check iNaturalist ID history and image licenses without fetching pixels
        run: python3 scripts/hays_seven_source_id_history.py
      - name: Save reviewed metadata to Hays audit branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audits/hays-58-photo-access-holds-id-history-20261111.json audits/hays-58-photo-access-holds-id-history-20261111.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Hays seven inaccessible source ID histories"
            git push origin HEAD:inat-coverage-audit-20261111
          fi
      - name: Preserve review as action artifact
        uses: actions/upload-artifact@v4
        with:
          name: hays-seven-hold-identification-histories
          path: |
            audits/hays-58-photo-access-holds-id-history-20261111.json
            audits/hays-58-photo-access-holds-id-history-20261111.md
          if-no-files-found: error
