name: Rights-first grass website strict-subset dry-run (NO deployment)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/poaceae-rights-first-site.yml','scripts/build_poaceae_rights_first_site.py','scripts/smoke_poaceae_preview.py','site/**']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, filter: blob:none}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build full staging learner and more restrictive rights-only site
        run: |
          python scripts/build_poaceae_site_preview.py
          python scripts/build_poaceae_rights_first_site.py
      - name: Install headless browser for strict-subset human-facing checks
        run: |
          python -m pip install "playwright>=1.53,<2"
          python -m playwright install --with-deps chromium
      - name: Test strict photo subset on desktop and mobile
        run: |
          mkdir -p qa-report
          python -m http.server 8765 --directory dist-safe > /tmp/poaceae-safe-preview.log 2>&1 &
          sleep 2
          POACEAE_TEST_URL=http://127.0.0.1:8765 python scripts/smoke_poaceae_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poaceae-strict-rights-first-preview-metadata
          path: qa-report/
          retention-days: 30
          if-no-files-found: warn
