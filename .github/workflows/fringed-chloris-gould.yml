name: Fringed chloris Gould comparison
on:
  pull_request:
    paths:
      - 'site/visual-key-lab/index.html'
      - 'site/visual-key-lab/gould-fringed-chloris-character-supplement.json'
      - 'scripts/test_fringed_chloris_gould.cjs'
      - '.github/workflows/fringed-chloris-gould.yml'
  push:
    branches: [main]
    paths:
      - 'site/visual-key-lab/index.html'
      - 'site/visual-key-lab/gould-fringed-chloris-character-supplement.json'
      - 'scripts/test_fringed_chloris_gould.cjs'
      - '.github/workflows/fringed-chloris-gould.yml'
permissions:
  contents: read
jobs:
  fringed-chloris-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_fringed_chloris_gould.cjs
      - run: node scripts/test_grass_169_all_option_functionality.cjs
      - run: node scripts/test_grass_three_way_evidence_key.cjs
      - run: node scripts/test_grass_gould_1975_reference.cjs
      - run: node scripts/test_kr_gould_character_mapping.cjs

