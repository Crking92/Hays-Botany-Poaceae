name: Auto-add approved grass images as new anatomy gallery panels
on:
  push:
    branches: [main]
    paths: ['photo-intake/approved/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: poaceae-family-auto-photo-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Isolate the current published Poaceae learner
        run: |
          git fetch origin main
          git worktree add "$RUNNER_TEMP/grass-release" origin/main
      - name: Validate exact species, copyright source metadata, image bytes
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 "$RUNNER_TEMP/grass-release/scripts/publish_approved_grass_photos.py" --source-root . --site-root "$RUNNER_TEMP/grass-release/site" --check
      - name: Install additional panel without overwriting any previous annotation
        run: python3 "$RUNNER_TEMP/grass-release/scripts/publish_approved_grass_photos.py" --source-root . --site-root "$RUNNER_TEMP/grass-release/site"
      - name: Confirm new panel link and counters match the actual site
        working-directory: ${{ runner.temp }}/grass-release
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path("site")
          index=json.loads((root/"data/poaceae-index.json").read_text())
          gallery=json.loads((root/"data/gallery-index.json").read_text())
          assert len(index)==gallery["species"]==112
          assert gallery["photo_panels"]==sum(gallery["entries"][x["id"]]["count"] for x in index)
          for x in index:
              sid=x["id"]
              card=json.loads((root/"data/species"/(sid+".json")).read_text())
              assert x["local_panel_count"]==len(card["panels"])==gallery["entries"][sid]["count"]
              for panel in card["panels"]:
                  if not panel["src"].startswith("media/"+sid+"/"):continue
                  data=(root/panel["src"]).read_bytes()
                  digest=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\\0"+data).hexdigest()
                  assert digest==panel["source_blob_sha"]
          print("PASS: no grass panel lost and all new gallery images have matching bytes")
          PY
      - name: Publish verified grass panel additions only
        id: release
        working-directory: ${{ runner.temp }}/grass-release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/media/ site/data/species/ site/data/poaceae-index.json site/data/gallery-index.json
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Auto-add approved grass source photo panels"
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild dedicated grass learner public Pages
        if: steps.release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
