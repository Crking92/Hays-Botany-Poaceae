name: Grass trial public delivery — verify twelve normal-key cards and credit links
on:
  pull_request:
    paths:
      - 'scripts/smoke_public_grass_trial.py'
      - '.github/workflows/grass-trial-public-delivery.yml'
  push:
    branches: [main]
    paths:
      - 'site/visual-key-lab/index.html'
      - 'site/visual-key-lab/provisional-trial-profiles.json'
      - 'site/visual-key-lab/provisional-trial-batch2.json'
      - 'scripts/smoke_public_grass_trial.py'
      - '.github/workflows/grass-trial-public-delivery.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify-public-trial:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium for real public key card and mobile interaction tests
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Confirm public Pages serves exact twelve trials and real browser result labels
        run: python scripts/smoke_public_grass_trial.py
