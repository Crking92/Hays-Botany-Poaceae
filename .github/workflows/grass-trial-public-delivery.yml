name: Grass trial public delivery — verify 53 normal-key cards and credited photos
on:
  pull_request:
    paths:
      - 'scripts/smoke_public_grass_trial.py'
      - '.github/workflows/grass-trial-public-delivery.yml'
  push:
    branches: [main]
    paths:
      - 'site/visual-key-lab/index.html'
      - 'site/visual-key-lab/provisional-trial-profiles.json'
      - 'site/visual-key-lab/provisional-trial-batch2.json'
      - 'site/visual-key-lab/provisional-trial-batch3.json'
      - 'site/visual-key-lab/provisional-trial-batch4.json'
      - 'site/visual-key-lab/provisional-trial-batch5-a.json'
      - 'site/visual-key-lab/provisional-trial-batch5-b.json'
      - 'site/visual-key-lab/provisional-trial-batch5-c.json'
      - 'scripts/smoke_public_grass_trial.py'
      - '.github/workflows/grass-trial-public-delivery.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  validate-public-trial-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and exact 112/53/4 research inventory audit
        run: |
          python -m py_compile scripts/smoke_public_grass_trial.py
          python - <<'PY'
          import json
          from pathlib import Path
          lab = Path("site/visual-key-lab")
          files = ["provisional-trial-profiles.json", "provisional-trial-batch2.json", "provisional-trial-batch3.json", "provisional-trial-batch4.json", "provisional-trial-batch5-a.json", "provisional-trial-batch5-b.json", "provisional-trial-batch5-c.json"]
          groups = [json.loads((lab/f).read_text())["profiles"] for f in files]
          assert list(map(len,groups)) == [6,6,6,6,11,10,8]
          all_rows = [x for g in groups for x in g]
          assert len(all_rows)==53 and len({x["id"] for x in all_rows})==53
          assert all(x["trial"] is True and x["range"]=="UNVERIFIED" and x["admission_status"]=="RESEARCH_TRIAL_NOT_ADMITTED" for x in all_rows)
          holds = [x for f in files[-3:] for x in json.loads((lab/f).read_text())["holds"]]
          assert {x["id"] for x in holds} == {"bromus-brevis","cortaderia-selloana","phyllostachys-aurea","lolium-x-boucheanum"}
          print("PASS: 112 official + 53 unverified / 4 documented holds")
          PY
  verify-public-trial:
    # A PR cannot pass exact live Pages parity before its changes are merged.
    # Source/status regressions are covered by the local trial-4 workflow.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium for real public key card and mobile interaction tests
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Confirm Pages serves all 53 unverified trials and 4 held Learner grasses
        run: python scripts/smoke_public_grass_trial.py
