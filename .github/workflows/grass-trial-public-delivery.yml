name: Grass trial public delivery — verify all 53 normal-key research cards and credit links
on:
  pull_request:
    paths:
      - 'scripts/smoke_public_grass_trial.py'
      - '.github/workflows/grass-trial-public-delivery.yml'
  push:
    branches: [main]
    paths:
      - 'site/visual-key-lab/index.html'
      - 'site/visual-key-lab/provisional-trial-profiles.json'
      - 'site/visual-key-lab/provisional-trial-batch2.json'
      - 'site/visual-key-lab/provisional-trial-batch3.json'
      - 'site/visual-key-lab/provisional-trial-batch4.json'
      - 'site/visual-key-lab/provisional-trial-batch5-*.json'
      - 'scripts/smoke_public_grass_trial.py'
      - '.github/workflows/grass-trial-public-delivery.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check public trial smoke script syntax
        run: python3 -m py_compile scripts/smoke_public_grass_trial.py
  verify-public-trial:
    # A PR cannot pass exact live Pages parity before its changes are merged.
    # Source/status regressions are covered by the local trial-4 workflow.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium for real public key card and mobile interaction tests
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Confirm public Pages serves all 53 unverified research trials in mobile browser
        run: python scripts/smoke_public_grass_trial.py
