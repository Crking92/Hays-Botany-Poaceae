name: Temporary Melica source pixel contact review (NOT publishing)
on:
  pull_request:
    paths:
      - 'scripts/_temp_melica_contact_20261112.py'
      - '.github/workflows/_temp_melica_contact_20261112.yml'
permissions: {contents: read}
jobs:
  contact:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pillow>=11,<13'
      - run: python scripts/_temp_melica_contact_20261112.py
