name: Import Poaceae source snapshot (rights-filtered staging ONLY)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-poaceae-staging.yml"
      - "scripts/import_poaceae_from_snapshot.py"
      - "migration/poaceae-source-manifest-20261028.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poaceae-rights-filtered-staging-import
  cancel-in-progress: false

jobs:
  import-grass-family:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout new Poaceae destination, with existing git history
        uses: actions/checkout@v4
        with:
          path: destination
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout pinned ORIGINAL source snapshot read-only
        uses: actions/checkout@v4
        with:
          repository: Crking92/Hays-County-Botany
          ref: d5812999ea32d03b873110db1a526e20ac6ea730
          path: source-snapshot
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            content/taxa/Poaceae
            scripts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install library needed for unchanged source rights checker
        run: python -m pip install "Pillow>=10,<12"

      - name: Verify pinned source commit and that destination is an empty content staging area
        run: |
          set -euo pipefail
          test "$(git -C source-snapshot rev-parse HEAD)" = "d5812999ea32d03b873110db1a526e20ac6ea730"
          test ! -e destination/content/taxa/Poaceae
          test -f destination/migration/poaceae-source-manifest-20261028.json
          echo "PINNED_CHECKOUT_OK"

      - name: Verify ALL 1,402 original files and copy only rights-screened source photos
        run: |
          python destination/scripts/import_poaceae_from_snapshot.py \
            --source source-snapshot \
            --destination destination \
            --manifest destination/migration/poaceae-source-manifest-20261028.json

      - name: Validate staged file counts, current rights hold ledger, and exact destination hashes
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('destination')
          report=json.loads((root/'migration/poaceae-transfer-status.json').read_text())
          rows=json.loads((root/'migration/source-file-ledger.json').read_text())
          assert report['stage']=='STAGING_ONLY_NOT_PUBLISHED'
          assert report['file_level_checksum_passed'] and report['no_original_deletion']
          assert len(rows)==1402
          total=sum(1 for x in rows if x['disposition']!='IMAGE_HELD_IN_ORIGINAL_SOURCE_ONLY')
          assert total==1178
          assert sum(1 for x in rows if x['disposition']=='IMAGE_HELD_IN_ORIGINAL_SOURCE_ONLY')==224
          assert sum(x['path'].endswith('/species.json') for x in rows)==112
          assert sum(x['path'].endswith('/genus.json') for x in rows)==53
          assert sum(x['path'].endswith('/family.json') for x in rows)==1
          copied=[x for x in rows if x['disposition']!='IMAGE_HELD_IN_ORIGINAL_SOURCE_ONLY']
          for item in copied:
            f=root/item['path']
            assert f.is_file(),item['path']
            size=f.stat().st_size
            assert size==item['bytes'],item['path']
          assert not (root/'content/taxa/Poaceae/.github').exists()
          print('STAGED_FILES',len(copied))
          print('RIGHTS_HELD_IMAGES_NOT_COMMITTED',224)
          print('NO_WEBSITE_PUBLISHED')
          PY

      - name: Commit destination only, leaving original main and Pages unchanged
        working-directory: destination
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/taxa/Poaceae
          git add migration/source-file-ledger.json migration/image-record-review-ledger.json migration/poaceae-transfer-status.json
          if git diff --cached --quiet; then
            echo "NO_STAGING_CHANGES"
            exit 0
          fi
          git commit -m "Stage 112 grasses and 788 conservative license photo candidates from pinned source snapshot"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Summary
        if: success()
        run: |
          echo "Imported source data and approved-license candidates into Poaceae staging repository."
          echo "No GitHub Pages deployment, cutover, original deletion, or website switch performed."
