name: Test grass photo publisher preserves original anatomy panels
on:
  push:
    branches: [main]
    paths: ['scripts/publish_approved_grass_photos.py','scripts/publish_approved_family_photos.py','scripts/test_grass_photo_intake.py','.github/workflows/test-grass-photo-intake.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: python3 scripts/test_grass_photo_intake.py
