name: Grass QA temporary hosted image proof (read only)
on:
  push:
    branches:
      - grass-qa-pass43-readonly-image-probe-20261111
    paths:
      - .github/workflows/grass-qa-pass43-image-proof.yml
permissions:
  contents: read
jobs:
  view-hosted-images:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            site/media/arundo-donax/g3-gbif-6195810483-photo_1.jpg
            content/taxa/Poaceae/Bothriochloa/bothriochloa-barbinodis/images/commons-archive-2b98f73ec716071b.jpg
            content/taxa/Poaceae/Bothriochloa/bothriochloa-torreyana/images/commons-bothriochloa-torreyana-6297402fc283.jpg
            content/taxa/Poaceae/Bothriochloa/bothriochloa-torreyana/images/smallcurio-austin-silver-bluestem-2017.jpg
            content/taxa/Poaceae/Bromus/bromus-japonicus/images/stefan-lefnaer-bromus-japonicus-true-hairy-stem-nodes-sl20.jpg
            content/taxa/Poaceae/Bromus/bromus-japonicus/images/stefan-lefnaer-bromus-japonicus-real-glumes-at-spikelet-base-sl24.jpg
            content/taxa/Poaceae/Catapodium/catapodium-rigidum/images/commons-catapodium-ligule-1.jpg
            content/taxa/Poaceae/Phragmites/phragmites-australis/images/nonenmacher-rhizomes-sca-00129.jpg
            site/media/heteropogon-contortus/inat-27411269.jpeg
            content/taxa/Poaceae/Tridentopsis/tridentopsis-buckleyana/images/buckley-tridens-inat-173616239-cc-by-original.jpg
            content/taxa/Poaceae/Zizaniopsis/zizaniopsis-miliacea/images/giant-cutgrass-alex-abair-review-264449047.jpg
            content/taxa/Poaceae/Zizania/zizania-texana/images/usfws-hagerty-20539.jpg
            content/taxa/Poaceae/Zizania/zizania-texana/images/usfws-hagerty-20540.jpg
            content/taxa/Poaceae/Eragrostis/eragrostis-cilianensis/images/harry-rose-collar-ligule.jpg
      - name: Render existing photos into read-only proof sheets
        shell: bash
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import sys, json, os, io, hashlib, base64, textwrap
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          items = json.loads("[[\"Arundo donax i6\",\"site/media/arundo-donax/g3-gbif-6195810483-photo_1.jpg\",\"7e3015a0b369c5cd8c2181c3f9b9a5d1320a0e8f\"],[\"Bothriochloa barbinodis i1\",\"content/taxa/Poaceae/Bothriochloa/bothriochloa-barbinodis/images/commons-archive-2b98f73ec716071b.jpg\",\"79175d001fae6036eed96a7c8239de7f5d1a2d3d\"],[\"Bothriochloa torreyana i1\",\"content/taxa/Poaceae/Bothriochloa/bothriochloa-torreyana/images/commons-bothriochloa-torreyana-6297402fc283.jpg\",\"d8498a6a4ecbc4f03fef0ac286caaf739b6e0f96\"],[\"Bothriochloa torreyana i2\",\"content/taxa/Poaceae/Bothriochloa/bothriochloa-torreyana/images/smallcurio-austin-silver-bluestem-2017.jpg\",\"f3f37efe9e6cdec230abab9af5d9503c99ce34a6\"],[\"Bromus japonicus i3\",\"content/taxa/Poaceae/Bromus/bromus-japonicus/images/stefan-lefnaer-bromus-japonicus-true-hairy-stem-nodes-sl20.jpg\",\"681f44c17f8324b0f3862f59e7225f7b9638b029\"],[\"Bromus japonicus i5\",\"content/taxa/Poaceae/Bromus/bromus-japonicus/images/stefan-lefnaer-bromus-japonicus-real-glumes-at-spikelet-base-sl24.jpg\",\"779ed8d50ca4ee59a0128f579edd8442bf62ecb8\"],[\"Catapodium rigidum i1\",\"content/taxa/Poaceae/Catapodium/catapodium-rigidum/images/commons-catapodium-ligule-1.jpg\",\"ee96fa066ece807c60524056bf5509b1ef32092e\"],[\"Phragmites australis i6\",\"content/taxa/Poaceae/Phragmites/phragmites-australis/images/nonenmacher-rhizomes-sca-00129.jpg\",\"9558f9e04b99ab831f88d4c8955010846e5247c4\"],[\"Heteropogon contortus i12\",\"site/media/heteropogon-contortus/inat-27411269.jpeg\",\"10eb5e42eb4e647529de9c0549506e4a7e1217b1\"],[\"Tridentopsis buckleyana i0\",\"content/taxa/Poaceae/Tridentopsis/tridentopsis-buckleyana/images/buckley-tridens-inat-173616239-cc-by-original.jpg\",\"558d0d3e65601479e1b4616187a3c48c161319f7\"],[\"Zizaniopsis miliacea i3\",\"content/taxa/Poaceae/Zizaniopsis/zizaniopsis-miliacea/images/giant-cutgrass-alex-abair-review-264449047.jpg\",\"66937606d3bdc53132042b8093ce49cfd2b56eae\"],[\"Zizania texana i3\",\"content/taxa/Poaceae/Zizania/zizania-texana/images/usfws-hagerty-20539.jpg\",\"cb0885a7e1f783caa2faa8d67a18500f90835e12\"],[\"Zizania texana i4\",\"content/taxa/Poaceae/Zizania/zizania-texana/images/usfws-hagerty-20540.jpg\",\"73a84371696dbc2f2d654b8ad901bf4ff06de5b0\"],[\"Eragrostis cilianensis i1\",\"content/taxa/Poaceae/Eragrostis/eragrostis-cilianensis/images/harry-rose-collar-ligule.jpg\",\"3b944b64348a8c1763e91372fafa15dfc3497abc\"]]")
          fontpath='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          font = ImageFont.truetype(fontpath, 17) if os.path.exists(fontpath) else ImageFont.load_default()
          photos=[]
          for n,(label,path,sha) in enumerate(items):
              try:
                  b=open(path,'rb').read()
                  actual=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\x00'+b).hexdigest()
                  if actual != sha: raise ValueError('blob SHA mismatch: '+actual)
                  pic=Image.open(io.BytesIO(b))
                  pic=ImageOps.exif_transpose(pic).convert('RGB')
                  print(f'QAITEM_{n+1}:OK sha={actual} dims={pic.size} bytes={len(b)} name={label}', flush=True)
                  photos.append((label,pic))
              except Exception as e:
                  print(f'QAITEM_{n+1}:FAILED name={label} error={e}', flush=True)
                  photos.append((label,None))
          for sheet_index in range((len(photos)+5)//6):
              canvas=Image.new('RGB',(1650,1000),(244,245,245))
              draw=ImageDraw.Draw(canvas)
              for j,(label,pic) in enumerate(photos[sheet_index*6:(sheet_index+1)*6]):
                  x=(j%3)*550; y=(j//3)*500
                  draw.text((x+12,y+12),f'{sheet_index*6+j+1}. {label}', fill=(12,12,12),font=font)
                  if pic:
                      im=ImageOps.contain(pic,(520,450))
                      ox=x+int((550-im.width)/2)
                      oy=y+36+int((450-im.height)/2)
                      canvas.paste(im,(ox,oy))
                  else: draw.text((x+30,y+200),'IMAGE UNAVAILABLE',fill=(0,0,0),font=font)
              buff=io.BytesIO()
              canvas.save(buff,format='JPEG',quality=51,optimize=True)
              b64=base64.b64encode(buff.getvalue()).decode('ascii')
              print(f'QAPANEL_BEGIN:{sheet_index+1} size={len(buff.getvalue())} b64={len(b64)}',flush=True)
              for c in textwrap.wrap(b64,500):
                  print(f'QAPANEL_{sheet_index+1}:{c}', flush=True)
              print(f'QAPANEL_END:{sheet_index+1}',flush=True)
          
          PY
