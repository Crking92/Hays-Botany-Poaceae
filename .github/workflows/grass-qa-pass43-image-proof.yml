name: Grass QA temporary hosted image proof (read only)
on:
  push:
    branches:
      - grass-qa-pass43-readonly-image-probe-20261111
    paths:
      - .github/workflows/grass-qa-pass43-image-proof.yml
permissions:
  contents: read
jobs:
  view-hosted-images:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            site/media/hilaria-belangeri/inat-182584875.jpeg
            site/media/muhlenbergia-paniculata/inat-281075496.jpg
            content/taxa/Poaceae/Panicum/panicum-hallii/images/patrick-alexander-hallii-glossy-fruits.jpg
            content/taxa/Poaceae/Aristida/aristida-purpurea/images/curtis-clark-threeawn-fruits-awns.jpg
            site/media/echinochloa-crus-galli/gbif-2807653287-50bc36249048.jpg
            content/taxa/Poaceae/Hordeum/hordeum-pusillum/images/commons-8bd54577a9b2.jpg
            content/taxa/Poaceae/Panicum/panicum-virgatum/images/stefan-lefnaer-switchgrass-glume-lemma-palea-dissection-cc-by-sa4.jpg
            content/taxa/Poaceae/Paspalum/paspalum-distichum/images/harry-rose-knotgrass-wetland-habit5.jpg
            content/taxa/Poaceae/Setaria/setaria-scheelei/images/commons-bd07b9665c3b.jpg
            site/media/anatherum-virginicum/inat-626921610.jpg
            site/media/sorghastrum-elliottii/inat-460787859.jpg
            site/media/sporobolus-vaginiflorus/inat-431806316.jpg
      - name: Render twelve existing images into two thumbnail proof sheets
        shell: bash
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import sys, json, os, io, hashlib, base64, textwrap
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          items = json.loads("[[\"Hilaria belangeri i5\",\"site/media/hilaria-belangeri/inat-182584875.jpeg\",\"f1f403ae9c900771b935bdb2273319c5769f4bd0\"],[\"Muhlenbergia paniculata i3\",\"site/media/muhlenbergia-paniculata/inat-281075496.jpg\",\"17e756b4016b6e4224c395314f32a9a5f7263f1a\"],[\"Panicum hallii i3\",\"content/taxa/Poaceae/Panicum/panicum-hallii/images/patrick-alexander-hallii-glossy-fruits.jpg\",\"bcd77c64b73af24032d58f5805c4819e16ae2b2a\"],[\"Aristida purpurea i3\",\"content/taxa/Poaceae/Aristida/aristida-purpurea/images/curtis-clark-threeawn-fruits-awns.jpg\",\"de0254a9c7d59c229130673ef0888e2701f02282\"],[\"Echinochloa crus-galli i9\",\"site/media/echinochloa-crus-galli/gbif-2807653287-50bc36249048.jpg\",\"81d974e4c9a1d105363c950ffdb938a6d862beb6\"],[\"Hordeum pusillum i0\",\"content/taxa/Poaceae/Hordeum/hordeum-pusillum/images/commons-8bd54577a9b2.jpg\",\"052a0803160ab3be5033f4ae1176d4a9fbbd29df\"],[\"Panicum virgatum i4\",\"content/taxa/Poaceae/Panicum/panicum-virgatum/images/stefan-lefnaer-switchgrass-glume-lemma-palea-dissection-cc-by-sa4.jpg\",\"adb55ecc4d15097d5db66a348562648854328010\"],[\"Paspalum distichum i4\",\"content/taxa/Poaceae/Paspalum/paspalum-distichum/images/harry-rose-knotgrass-wetland-habit5.jpg\",\"35d25ef4b57ac89dc32930813de2eac81de8840e\"],[\"Setaria scheelei i1\",\"content/taxa/Poaceae/Setaria/setaria-scheelei/images/commons-bd07b9665c3b.jpg\",\"57db040223a091dbdcc3368a4c57a7535dfc051c\"],[\"Anatherum virginicum i4\",\"site/media/anatherum-virginicum/inat-626921610.jpg\",\"d183c0a19b681492d80394d189a17b33bc54938d\"],[\"Sorghastrum elliottii i6\",\"site/media/sorghastrum-elliottii/inat-460787859.jpg\",\"4f2616953c6e2dbe2309a47813a08a83da911f8a\"],[\"Sporobolus vaginiflorus i4\",\"site/media/sporobolus-vaginiflorus/inat-431806316.jpg\",\"131a907c6b36182bd318175f4572406fb9e84f35\"]]")
          fontpath='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          font = ImageFont.truetype(fontpath, 17) if os.path.exists(fontpath) else ImageFont.load_default()
          photos=[]
          for n,(label,path,sha) in enumerate(items):
              try:
                  b=open(path,'rb').read()
                  actual=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\x00'+b).hexdigest()
                  if actual != sha: raise ValueError('blob SHA mismatch: '+actual)
                  pic=Image.open(io.BytesIO(b))
                  pic=ImageOps.exif_transpose(pic).convert('RGB')
                  print(f'QAITEM_{n+1}:OK sha={actual} dims={pic.size} bytes={len(b)} name={label}', flush=True)
                  photos.append((label,pic))
              except Exception as e:
                  print(f'QAITEM_{n+1}:FAILED name={label} error={e}', flush=True)
                  photos.append((label,None))
          for sheet_index in (0,1):
              canvas=Image.new('RGB',(1650,1000),(244,245,245))
              draw=ImageDraw.Draw(canvas)
              for j,(label,pic) in enumerate(photos[sheet_index*6:(sheet_index+1)*6]):
                  x=(j%3)*550; y=(j//3)*500
                  draw.text((x+12,y+12),f'{sheet_index*6+j+1}. {label}', fill=(12,12,12),font=font)
                  if pic:
                      im=ImageOps.contain(pic,(520,450))
                      ox=x+int((550-im.width)/2)
                      oy=y+36+int((450-im.height)/2)
                      canvas.paste(im,(ox,oy))
                  else: draw.text((x+30,y+200),'IMAGE UNAVAILABLE',fill=(0,0,0),font=font)
              buff=io.BytesIO()
              canvas.save(buff,format='JPEG',quality=51,optimize=True)
              b64=base64.b64encode(buff.getvalue()).decode('ascii')
              print(f'QAPANEL_BEGIN:{sheet_index+1} size={len(buff.getvalue())} b64={len(b64)}',flush=True)
              for c in textwrap.wrap(b64,500):
                  print(f'QAPANEL_{sheet_index+1}:{c}', flush=True)
              print(f'QAPANEL_END:{sheet_index+1}',flush=True)
          
          PY
