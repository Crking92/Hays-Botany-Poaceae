name: Grass QA temporary hosted image proof (read only)
on:
  push:
    branches:
      - grass-qa-pass43-readonly-image-probe-20261111
    paths:
      - .github/workflows/grass-qa-pass43-image-proof.yml
permissions:
  contents: read
jobs:
  view-hosted-images:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            site/media/eragrostis-spectabilis/gbif-2807421445-b5de7a2f9522.jpg
            site/media/eragrostis-spectabilis/gbif-3336609370-cff45e4017d7.jpg
            site/media/eragrostis-spectabilis/gbif-5073921318-249e0d7edf34.jpg
            site/media/eragrostis-spectabilis/gbif-5073923326-8782ca74f5e0.jpg
            content/taxa/Poaceae/Setaria/setaria-parviflora/images/stefan-lefnaer-whole-attached-flowering-sl1.jpg
            content/taxa/Poaceae/Setaria/setaria-parviflora/images/stefan-lefnaer-knotty-rhizome.jpg
            content/taxa/Poaceae/Setaria/setaria-parviflora/images/stefan-lefnaer-bristle-base-sl24.jpg
            content/taxa/Poaceae/Setaria/setaria-parviflora/images/stefan-lefnaer-glume-lemma-sl29.jpg
            content/taxa/Poaceae/Aristida/aristida-oligantha/images/commons-archive-0932f5b62b86b1a5.jpg
            site/media/aristida-oligantha/g3-gbif-5101132408-photo_3.jpg
            content/taxa/Poaceae/Digitaria/digitaria-ciliaris/images/commons-77cde2e462d3.jpg
            content/taxa/Poaceae/Digitaria/digitaria-ciliaris/images/starr-140909-1746-live-habit-maui.jpg
            site/media/digitaria-ciliaris/inat-736151054.jpg
            site/media/digitaria-ciliaris/gbif-6161282426-605dfd848228.jpg
            content/taxa/Poaceae/Eragrostis/eragrostis-trichodes/images/daderot-dresden-inground-bunch-2013.jpg
            site/media/eragrostis-trichodes/inat-480914542.jpg
            site/media/eragrostis-trichodes/gbif-2807465979-6301123acc2f.jpg
            content/taxa/Poaceae/Digitaria/digitaria-cognata/images/shaun-pogacnik-99737817.jpg
            site/media/digitaria-cognata/gbif-2807535176-8b285cbcccf7.jpg
            site/media/dinebra-panicea-subsp-mucronata/gbif-2807491498-8ec32d69ecf6.jpg
            site/media/dinebra-panicea-subsp-mucronata/gbif-2807654501-792696e83f4d.jpg
            site/media/eragrostis-hirsuta/inat-145933258.jpeg
            site/media/eragrostis-hirsuta/gbif-2807314748-ee9753b1cc84.jpg
            site/media/eragrostis-hirsuta/gbif-2807651549-6f6a8e658bb1.jpg
            site/media/eragrostis-hirsuta/gbif-5101132301-55deb08c2638.jpg
            content/taxa/Poaceae/Eragrostis/eragrostis-lugens/images/dryopteris2-in-situ-rooted-leafy-clump.jpg
            content/taxa/Poaceae/Eragrostis/eragrostis-lugens/images/harry-rose-lugens-leaf-sheath.jpg
            site/media/eragrostis-lugens/gbif-2807405301-b6b0f364a75a.jpg
            site/media/eragrostis-lugens/gbif-2807409261-7cd65cd6144a.jpg
            site/media/eragrostis-lugens/gbif-2807630517-0620aaabe17f.jpg
            site/media/eragrostis-lugens/gbif-2882607317-457a92dbc220.jpg
            site/media/hilaria-mutica/gbif-2807367566-af851959120a.jpg
            content/taxa/Poaceae/Setaria/setaria-italica/images/setaria-italica-ligule-stefan-lefnaer.jpg
            content/taxa/Poaceae/Setaria/setaria-italica/images/setaria-italica-spikelet-stefan-lefnaer.jpg
      - name: Render existing photos into read-only proof sheets
        shell: bash
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import sys, json, os, io, hashlib, base64, textwrap
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          items = json.loads("[[\"Eragrostis spectabilis i4\",\"site/media/eragrostis-spectabilis/gbif-2807421445-b5de7a2f9522.jpg\",\"\"],[\"Eragrostis spectabilis i5\",\"site/media/eragrostis-spectabilis/gbif-3336609370-cff45e4017d7.jpg\",\"\"],[\"Eragrostis spectabilis i6\",\"site/media/eragrostis-spectabilis/gbif-5073921318-249e0d7edf34.jpg\",\"\"],[\"Eragrostis spectabilis i7\",\"site/media/eragrostis-spectabilis/gbif-5073923326-8782ca74f5e0.jpg\",\"\"],[\"Setaria parviflora i0\",\"content/taxa/Poaceae/Setaria/setaria-parviflora/images/stefan-lefnaer-whole-attached-flowering-sl1.jpg\",\"\"],[\"Setaria parviflora i1\",\"content/taxa/Poaceae/Setaria/setaria-parviflora/images/stefan-lefnaer-knotty-rhizome.jpg\",\"\"],[\"Setaria parviflora i3\",\"content/taxa/Poaceae/Setaria/setaria-parviflora/images/stefan-lefnaer-bristle-base-sl24.jpg\",\"\"],[\"Setaria parviflora i5\",\"content/taxa/Poaceae/Setaria/setaria-parviflora/images/stefan-lefnaer-glume-lemma-sl29.jpg\",\"\"],[\"Aristida oligantha i0\",\"content/taxa/Poaceae/Aristida/aristida-oligantha/images/commons-archive-0932f5b62b86b1a5.jpg\",\"\"],[\"Aristida oligantha i3\",\"site/media/aristida-oligantha/g3-gbif-5101132408-photo_3.jpg\",\"\"],[\"Digitaria ciliaris i0\",\"content/taxa/Poaceae/Digitaria/digitaria-ciliaris/images/commons-77cde2e462d3.jpg\",\"\"],[\"Digitaria ciliaris i3\",\"content/taxa/Poaceae/Digitaria/digitaria-ciliaris/images/starr-140909-1746-live-habit-maui.jpg\",\"\"],[\"Digitaria ciliaris i7\",\"site/media/digitaria-ciliaris/inat-736151054.jpg\",\"\"],[\"Digitaria ciliaris i10\",\"site/media/digitaria-ciliaris/gbif-6161282426-605dfd848228.jpg\",\"\"],[\"Eragrostis trichodes i0\",\"content/taxa/Poaceae/Eragrostis/eragrostis-trichodes/images/daderot-dresden-inground-bunch-2013.jpg\",\"\"],[\"Eragrostis trichodes i2\",\"site/media/eragrostis-trichodes/inat-480914542.jpg\",\"\"],[\"Eragrostis trichodes i5\",\"site/media/eragrostis-trichodes/gbif-2807465979-6301123acc2f.jpg\",\"\"],[\"Digitaria cognata i0\",\"content/taxa/Poaceae/Digitaria/digitaria-cognata/images/shaun-pogacnik-99737817.jpg\",\"\"],[\"Digitaria cognata i9\",\"site/media/digitaria-cognata/gbif-2807535176-8b285cbcccf7.jpg\",\"\"],[\"Dinebra panicea subsp. mucronata i5\",\"site/media/dinebra-panicea-subsp-mucronata/gbif-2807491498-8ec32d69ecf6.jpg\",\"\"],[\"Dinebra panicea subsp. mucronata i7\",\"site/media/dinebra-panicea-subsp-mucronata/gbif-2807654501-792696e83f4d.jpg\",\"\"],[\"Eragrostis hirsuta i4\",\"site/media/eragrostis-hirsuta/inat-145933258.jpeg\",\"\"],[\"Eragrostis hirsuta i6\",\"site/media/eragrostis-hirsuta/gbif-2807314748-ee9753b1cc84.jpg\",\"\"],[\"Eragrostis hirsuta i7\",\"site/media/eragrostis-hirsuta/gbif-2807651549-6f6a8e658bb1.jpg\",\"\"],[\"Eragrostis hirsuta i8\",\"site/media/eragrostis-hirsuta/gbif-5101132301-55deb08c2638.jpg\",\"\"],[\"Eragrostis lugens i1\",\"content/taxa/Poaceae/Eragrostis/eragrostis-lugens/images/dryopteris2-in-situ-rooted-leafy-clump.jpg\",\"\"],[\"Eragrostis lugens i3\",\"content/taxa/Poaceae/Eragrostis/eragrostis-lugens/images/harry-rose-lugens-leaf-sheath.jpg\",\"\"],[\"Eragrostis lugens i4\",\"site/media/eragrostis-lugens/gbif-2807405301-b6b0f364a75a.jpg\",\"\"],[\"Eragrostis lugens i5\",\"site/media/eragrostis-lugens/gbif-2807409261-7cd65cd6144a.jpg\",\"\"],[\"Eragrostis lugens i6\",\"site/media/eragrostis-lugens/gbif-2807630517-0620aaabe17f.jpg\",\"\"],[\"Eragrostis lugens i7\",\"site/media/eragrostis-lugens/gbif-2882607317-457a92dbc220.jpg\",\"\"],[\"Hilaria mutica i7\",\"site/media/hilaria-mutica/gbif-2807367566-af851959120a.jpg\",\"\"],[\"Setaria italica i1\",\"content/taxa/Poaceae/Setaria/setaria-italica/images/setaria-italica-ligule-stefan-lefnaer.jpg\",\"\"],[\"Setaria italica i2\",\"content/taxa/Poaceae/Setaria/setaria-italica/images/setaria-italica-spikelet-stefan-lefnaer.jpg\",\"\"]]")
          fontpath='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          font = ImageFont.truetype(fontpath, 17) if os.path.exists(fontpath) else ImageFont.load_default()
          photos=[]
          for n,(label,path,sha) in enumerate(items):
              try:
                  b=open(path,'rb').read()
                  actual=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\x00'+b).hexdigest()
                  if sha and actual != sha: raise ValueError('blob SHA mismatch: '+actual)
                  pic=Image.open(io.BytesIO(b))
                  pic=ImageOps.exif_transpose(pic).convert('RGB')
                  print(f'QAITEM_{n+1}:OK sha={actual} dims={pic.size} bytes={len(b)} name={label}', flush=True)
                  photos.append((label,pic))
              except Exception as e:
                  print(f'QAITEM_{n+1}:FAILED name={label} error={e}', flush=True)
                  photos.append((label,None))
          for sheet_index in range((len(photos)+5)//6):
              canvas=Image.new('RGB',(1650,1000),(244,245,245))
              draw=ImageDraw.Draw(canvas)
              for j,(label,pic) in enumerate(photos[sheet_index*6:(sheet_index+1)*6]):
                  x=(j%3)*550; y=(j//3)*500
                  draw.text((x+12,y+12),f'{sheet_index*6+j+1}. {label}', fill=(12,12,12),font=font)
                  if pic:
                      im=ImageOps.contain(pic,(520,450))
                      ox=x+int((550-im.width)/2)
                      oy=y+36+int((450-im.height)/2)
                      canvas.paste(im,(ox,oy))
                  else: draw.text((x+30,y+200),'IMAGE UNAVAILABLE',fill=(0,0,0),font=font)
              buff=io.BytesIO()
              canvas.save(buff,format='JPEG',quality=51,optimize=True)
              b64=base64.b64encode(buff.getvalue()).decode('ascii')
              print(f'QAPANEL_BEGIN:{sheet_index+1} size={len(buff.getvalue())} b64={len(b64)}',flush=True)
              for c in textwrap.wrap(b64,500):
                  print(f'QAPANEL_{sheet_index+1}:{c}', flush=True)
              print(f'QAPANEL_END:{sheet_index+1}',flush=True)
          
          PY
