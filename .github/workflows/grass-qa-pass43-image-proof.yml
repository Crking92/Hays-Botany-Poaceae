name: Grass QA temporary hosted image proof (read only)
on:
  push:
    branches:
      - grass-qa-pass43-readonly-image-probe-20261111
    paths:
      - .github/workflows/grass-qa-pass43-image-proof.yml
permissions:
  contents: read
jobs:
  view-hosted-images:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            site/media/elymus-canadensis/inat-72405973.jpg
            site/media/elymus-canadensis/gbif-3866885510-d9374a0680b9.jpg
            content/taxa/Poaceae/Eragrostis/eragrostis-secundiflora/images/sam-kieschnick-red-lovegrass-ground-growing-bunch-752434624.jpg
            content/taxa/Poaceae/Festuca/festuca-octoflora/images/commons-58eb098d241b.jpg
            content/taxa/Poaceae/Festuca/festuca-octoflora/images/commons-51b05fedea0c.jpg
            content/taxa/Poaceae/Sorghum/sorghum-bicolor/images/rasbak-sorghum-ligule-03.jpg
            content/taxa/Poaceae/Sorghum/sorghum-bicolor/images/rasbak-sorghum-flower-03.jpg
            content/taxa/Poaceae/Panicum/panicum-capillare/images/stefan-lefnaer-witchgrass-labelled-spikelet-parts-cc-by-sa4.jpg
            content/taxa/Poaceae/Panicum/panicum-capillare/images/matt-lavin-witchgrass-complete-diffuse-panicle-by-sa2.jpg
            content/taxa/Poaceae/Paspalum/paspalum-dilatatum/images/steve-finlayson-2026-rooted-crown-cc0.jpg
            content/taxa/Poaceae/Paspalum/paspalum-setaceum/images/alex-abair-49099738-field-habit.jpg
            content/taxa/Poaceae/Setaria/setaria-reverchonii/images/commons-7f11c328fb10.jpg
            content/taxa/Poaceae/Setaria/setaria-reverchonii/images/commons-d45564aecca8.jpg
            content/taxa/Poaceae/Setaria/setaria-reverchonii/images/clifton-ladd-duval-attached-spikelets-681610423.jpg
            content/taxa/Poaceae/Urochloa/urochloa-fusca/images/james-schnable-vegetative-urochloa-fusca.jpg
      - name: Render existing photos into read-only proof sheets
        shell: bash
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import sys, json, os, io, hashlib, base64, textwrap
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          items = json.loads("[[\"Elymus canadensis i7\",\"site/media/elymus-canadensis/inat-72405973.jpg\",\"46c2db5f7e0c719dad1971bbd9fd61814f1e9b1b\"],[\"Elymus canadensis i9\",\"site/media/elymus-canadensis/gbif-3866885510-d9374a0680b9.jpg\",\"d9260e436f11a6e64de670c55e26cb4fa5e07216\"],[\"Eragrostis secundiflora i4\",\"content/taxa/Poaceae/Eragrostis/eragrostis-secundiflora/images/sam-kieschnick-red-lovegrass-ground-growing-bunch-752434624.jpg\",\"0952735b8c71365df84312757cdb85bcacea2c3c\"],[\"Festuca octoflora i1\",\"content/taxa/Poaceae/Festuca/festuca-octoflora/images/commons-58eb098d241b.jpg\",\"9078e09dd9fa2d4a203d286397cc85c4113caea1\"],[\"Festuca octoflora i2\",\"content/taxa/Poaceae/Festuca/festuca-octoflora/images/commons-51b05fedea0c.jpg\",\"b6ce4679d46bcbce2defc0764f1ff35038ac61f5\"],[\"Sorghum bicolor i1\",\"content/taxa/Poaceae/Sorghum/sorghum-bicolor/images/rasbak-sorghum-ligule-03.jpg\",\"d4b6c5c8f87c2bc088ce25088f6ca40dcab34962\"],[\"Sorghum bicolor i2\",\"content/taxa/Poaceae/Sorghum/sorghum-bicolor/images/rasbak-sorghum-flower-03.jpg\",\"50cd96dc992af5136342c75c52bc8fa17a59fc17\"],[\"Panicum capillare i0\",\"content/taxa/Poaceae/Panicum/panicum-capillare/images/stefan-lefnaer-witchgrass-labelled-spikelet-parts-cc-by-sa4.jpg\",\"b52c585ef9cab8627aae6dc92744379ea3cfa75b\"],[\"Panicum capillare i1\",\"content/taxa/Poaceae/Panicum/panicum-capillare/images/matt-lavin-witchgrass-complete-diffuse-panicle-by-sa2.jpg\",\"b2b3144ce46862286148307157bae788bfc6ac7d\"],[\"Paspalum dilatatum i5\",\"content/taxa/Poaceae/Paspalum/paspalum-dilatatum/images/steve-finlayson-2026-rooted-crown-cc0.jpg\",\"dbfd88622f56b010b3b2fc944ec92c816f0fc65a\"],[\"Paspalum setaceum i3\",\"content/taxa/Poaceae/Paspalum/paspalum-setaceum/images/alex-abair-49099738-field-habit.jpg\",\"6f10a34e3ab3545254ff28ae1e5426fa846935ee\"],[\"Setaria reverchonii i0\",\"content/taxa/Poaceae/Setaria/setaria-reverchonii/images/commons-7f11c328fb10.jpg\",\"4a21f76d297c1c1f32c330caa103200849708dbe\"],[\"Setaria reverchonii i1\",\"content/taxa/Poaceae/Setaria/setaria-reverchonii/images/commons-d45564aecca8.jpg\",\"8a0925d9aa88d1f8b1a4541e54236b3486dbd6dd\"],[\"Setaria reverchonii i3\",\"content/taxa/Poaceae/Setaria/setaria-reverchonii/images/clifton-ladd-duval-attached-spikelets-681610423.jpg\",\"bd2afb85f7d2c334af2956d29ef65490db422c2f\"],[\"Urochloa fusca i3\",\"content/taxa/Poaceae/Urochloa/urochloa-fusca/images/james-schnable-vegetative-urochloa-fusca.jpg\",\"beb3706ee5ca28bac62e2d1cf6f5eb849e7d8b08\"]]")
          fontpath='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          font = ImageFont.truetype(fontpath, 17) if os.path.exists(fontpath) else ImageFont.load_default()
          photos=[]
          for n,(label,path,sha) in enumerate(items):
              try:
                  b=open(path,'rb').read()
                  actual=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\x00'+b).hexdigest()
                  if actual != sha: raise ValueError('blob SHA mismatch: '+actual)
                  pic=Image.open(io.BytesIO(b))
                  pic=ImageOps.exif_transpose(pic).convert('RGB')
                  print(f'QAITEM_{n+1}:OK sha={actual} dims={pic.size} bytes={len(b)} name={label}', flush=True)
                  photos.append((label,pic))
              except Exception as e:
                  print(f'QAITEM_{n+1}:FAILED name={label} error={e}', flush=True)
                  photos.append((label,None))
          for sheet_index in range((len(photos)+5)//6):
              canvas=Image.new('RGB',(1650,1000),(244,245,245))
              draw=ImageDraw.Draw(canvas)
              for j,(label,pic) in enumerate(photos[sheet_index*6:(sheet_index+1)*6]):
                  x=(j%3)*550; y=(j//3)*500
                  draw.text((x+12,y+12),f'{sheet_index*6+j+1}. {label}', fill=(12,12,12),font=font)
                  if pic:
                      im=ImageOps.contain(pic,(520,450))
                      ox=x+int((550-im.width)/2)
                      oy=y+36+int((450-im.height)/2)
                      canvas.paste(im,(ox,oy))
                  else: draw.text((x+30,y+200),'IMAGE UNAVAILABLE',fill=(0,0,0),font=font)
              buff=io.BytesIO()
              canvas.save(buff,format='JPEG',quality=51,optimize=True)
              b64=base64.b64encode(buff.getvalue()).decode('ascii')
              print(f'QAPANEL_BEGIN:{sheet_index+1} size={len(buff.getvalue())} b64={len(b64)}',flush=True)
              for c in textwrap.wrap(b64,500):
                  print(f'QAPANEL_{sheet_index+1}:{c}', flush=True)
              print(f'QAPANEL_END:{sheet_index+1}',flush=True)
          
          PY
