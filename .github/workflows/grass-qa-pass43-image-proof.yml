name: Grass QA temporary hosted image proof (read only)
on:
  push:
    branches:
      - grass-qa-pass43-readonly-image-probe-20261111
    paths:
      - .github/workflows/grass-qa-pass43-image-proof.yml
permissions:
  contents: read
jobs:
  view-hosted-images:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            content/taxa/Poaceae/Anatherum/anatherum-tenuispatheum/images/starr-var-pumilus-habit-ccby3.jpg
            content/taxa/Poaceae/Anatherum/anatherum-tenuispatheum/images/starr-080604-6308-historic-pumilus-ccby3.jpg
            content/taxa/Poaceae/Muhlenbergia/muhlenbergia-utilis/images/aparejo-cc0-inat-410577667.jpg
            content/taxa/Poaceae/Muhlenbergia/muhlenbergia-utilis/images/aparejo-cc0-inat-260420284.jpg
            content/taxa/Poaceae/Muhlenbergia/muhlenbergia-utilis/images/aparejo-cc0-inat-410577686.jpg
            content/taxa/Poaceae/Muhlenbergia/muhlenbergia-utilis/images/aparejo-cc0-inat-410577695.jpg
            content/taxa/Poaceae/Muhlenbergia/muhlenbergia-utilis/images/aparejo-cc0-inat-410577679.jpg
            site/media/muhlenbergia-utilis/inat-14855736.jpg
            content/taxa/Poaceae/Secale/secale-cereale/images/rasbak-rye-attached-flowering-ear-anthers-awns-cc-by-sa3.jpg
            content/taxa/Poaceae/Secale/secale-cereale/images/stefan-lefnaer-rye-four-collar-views-10mm-scale-by-sa4.jpg
            content/taxa/Poaceae/Secale/secale-cereale/images/stefan-lefnaer-rye-true-membranous-ligule-3mm-scale-by-sa4.jpg
            content/taxa/Poaceae/Secale/secale-cereale/images/matt-lavin-74e7e5ea8e.jpg
            content/taxa/Poaceae/Secale/secale-cereale/images/matt-lavin-55df7d2222.jpg
      - name: Render existing photos into read-only proof sheets
        shell: bash
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import sys, json, os, io, hashlib, base64, textwrap
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          items = json.loads("[[\"Anatherum tenuispatheum i0\",\"content/taxa/Poaceae/Anatherum/anatherum-tenuispatheum/images/starr-var-pumilus-habit-ccby3.jpg\",\"c53d1b07ba6a5b2c47d27bd30ca5b1313f2b1869\"],[\"Anatherum tenuispatheum i1\",\"content/taxa/Poaceae/Anatherum/anatherum-tenuispatheum/images/starr-var-pumilus-habit-ccby3.jpg\",\"c53d1b07ba6a5b2c47d27bd30ca5b1313f2b1869\"],[\"Anatherum tenuispatheum i2\",\"content/taxa/Poaceae/Anatherum/anatherum-tenuispatheum/images/starr-080604-6308-historic-pumilus-ccby3.jpg\",\"0b4e73d1a13bda1771b99d26bf04efe2627cde04\"],[\"Muhlenbergia utilis i0\",\"content/taxa/Poaceae/Muhlenbergia/muhlenbergia-utilis/images/aparejo-cc0-inat-410577667.jpg\",\"e60142979f896a7a2f857eba969f071fc32a623e\"],[\"Muhlenbergia utilis i1\",\"content/taxa/Poaceae/Muhlenbergia/muhlenbergia-utilis/images/aparejo-cc0-inat-260420284.jpg\",\"322c9f2c2b130f970903352491032eecd721daf9\"],[\"Muhlenbergia utilis i2\",\"content/taxa/Poaceae/Muhlenbergia/muhlenbergia-utilis/images/aparejo-cc0-inat-410577686.jpg\",\"079c8027450b7930b37fe18f4db8519b1dbf09c8\"],[\"Muhlenbergia utilis i3\",\"content/taxa/Poaceae/Muhlenbergia/muhlenbergia-utilis/images/aparejo-cc0-inat-410577695.jpg\",\"4b46ea5429edee52111b96eed15f77dce4510627\"],[\"Muhlenbergia utilis i4\",\"content/taxa/Poaceae/Muhlenbergia/muhlenbergia-utilis/images/aparejo-cc0-inat-410577679.jpg\",\"3efeddb74c20aa1120e59184a2eea932579d06d6\"],[\"Muhlenbergia utilis i5\",\"site/media/muhlenbergia-utilis/inat-14855736.jpg\",\"2dd7a4e11450df54c3a04ffef40c87cd5c26cc09\"],[\"Secale cereale i0\",\"content/taxa/Poaceae/Secale/secale-cereale/images/rasbak-rye-attached-flowering-ear-anthers-awns-cc-by-sa3.jpg\",\"fe8827ce8762d975a3d3ac7e872aae9463d1ca53\"],[\"Secale cereale i1\",\"content/taxa/Poaceae/Secale/secale-cereale/images/stefan-lefnaer-rye-four-collar-views-10mm-scale-by-sa4.jpg\",\"ec9ffc2b1cf347d03dc3a434a1380725d365605b\"],[\"Secale cereale i2\",\"content/taxa/Poaceae/Secale/secale-cereale/images/stefan-lefnaer-rye-true-membranous-ligule-3mm-scale-by-sa4.jpg\",\"9e549d06ca4d2ea5611829537c6a40b3ff3378cc\"],[\"Secale cereale i3\",\"content/taxa/Poaceae/Secale/secale-cereale/images/matt-lavin-74e7e5ea8e.jpg\",\"0ad779b1b75312d175f6f7c763667e9a0b9a0614\"],[\"Secale cereale i4\",\"content/taxa/Poaceae/Secale/secale-cereale/images/matt-lavin-55df7d2222.jpg\",\"b9e010c15281d1487da296b3e7e8dc5b89ae691a\"]]")
          fontpath='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          font = ImageFont.truetype(fontpath, 17) if os.path.exists(fontpath) else ImageFont.load_default()
          photos=[]
          for n,(label,path,sha) in enumerate(items):
              try:
                  b=open(path,'rb').read()
                  actual=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\x00'+b).hexdigest()
                  if actual != sha: raise ValueError('blob SHA mismatch: '+actual)
                  pic=Image.open(io.BytesIO(b))
                  pic=ImageOps.exif_transpose(pic).convert('RGB')
                  print(f'QAITEM_{n+1}:OK sha={actual} dims={pic.size} bytes={len(b)} name={label}', flush=True)
                  photos.append((label,pic))
              except Exception as e:
                  print(f'QAITEM_{n+1}:FAILED name={label} error={e}', flush=True)
                  photos.append((label,None))
          for sheet_index in range((len(photos)+5)//6):
              canvas=Image.new('RGB',(1650,1000),(244,245,245))
              draw=ImageDraw.Draw(canvas)
              for j,(label,pic) in enumerate(photos[sheet_index*6:(sheet_index+1)*6]):
                  x=(j%3)*550; y=(j//3)*500
                  draw.text((x+12,y+12),f'{sheet_index*6+j+1}. {label}', fill=(12,12,12),font=font)
                  if pic:
                      im=ImageOps.contain(pic,(520,450))
                      ox=x+int((550-im.width)/2)
                      oy=y+36+int((450-im.height)/2)
                      canvas.paste(im,(ox,oy))
                  else: draw.text((x+30,y+200),'IMAGE UNAVAILABLE',fill=(0,0,0),font=font)
              buff=io.BytesIO()
              canvas.save(buff,format='JPEG',quality=51,optimize=True)
              b64=base64.b64encode(buff.getvalue()).decode('ascii')
              print(f'QAPANEL_BEGIN:{sheet_index+1} size={len(buff.getvalue())} b64={len(b64)}',flush=True)
              for c in textwrap.wrap(b64,500):
                  print(f'QAPANEL_{sheet_index+1}:{c}', flush=True)
              print(f'QAPANEL_END:{sheet_index+1}',flush=True)
          
          PY
