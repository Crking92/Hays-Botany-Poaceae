name: Poaceae nonpublishing photo collection queue
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_collection_queue.py
      - .github/workflows/poaceae-data-collection-queue.yml
permissions: {contents: read}
jobs:
  collection-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, filter: blob:none}
      - name: Produce nonpublishing candidate-photo gap queue
        run: python scripts/build_collection_queue.py
      - uses: actions/upload-artifact@v4
        with:
          name: poaceae-research-photo-collection-queue
          path: qa-report/collection-queue/
          retention-days: 30
          if-no-files-found: error
