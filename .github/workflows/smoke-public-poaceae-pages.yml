name: Verify published Poaceae family learner and original image bytes
on:
  push:
    branches: [main]
    paths:
      - 'site/data/poaceae-release.json'
      - '.github/workflows/smoke-public-poaceae-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Test actual public Pages photo and glossary delivery
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse,time
          from pathlib import Path
          BASE="https://crking92.github.io/Hays-Botany-Poaceae/site/"
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"HaysBotanyPublicGrassPhotoSmoke"})
              with urllib.request.urlopen(req,timeout=18) as response:
                  assert response.status==200
                  return response.read(),response.headers.get("Content-Type","")
          local_release=json.loads(Path("site/data/poaceae-release.json").read_text())
          for attempt in range(16):
              try:
                  data,_=get(BASE+"data/poaceae-index.json")
                  index=json.loads(data)
                  live_release=json.loads(get(BASE+"data/poaceae-release.json")[0])
                  if (len(index)==112 and
                      live_release["photo_files_referenced_on_public_site"]==local_release["photo_files_referenced_on_public_site"] and
                      live_release["photo_panels_visible"]==local_release["photo_panels_visible"] and
                      live_release.get("species_with_target_species_source_photos")==112 and
                      live_release.get("curated_exact_photo_files")==25):
                      break
                  print("Pages deployment not yet current",attempt+1,live_release.get("photo_files_referenced_on_public_site"))
              except Exception as e:print("Pages not ready",repr(e))
              time.sleep(10)
          else:raise AssertionError("Poaceae public Pages index or current release has not deployed.")
          release=json.loads(get(BASE+"data/poaceae-release.json")[0])
          assert release["species"]==112
          assert release["photo_files_referenced_on_public_site"]>0
          assert b"gallery" in get(BASE+"app.js")[0].lower()
          checked=0
          for row in index:
              card=json.loads(get(BASE+"data/species/"+row["id"]+".json")[0])
              if not card["panels"]:continue
              panel=card["panels"][0]
              source=urllib.parse.urljoin(BASE,panel["src"])
              body,mime=get(source)
              assert mime.lower().startswith("image/") and len(body)>500
              assert body.startswith((b"\xff\xd8\xff",b"\x89PNG\r\n\x1a\n",b"RIFF"))
              checked+=1
          assert checked==release["species_with_visible_photos"]
          # This pass's 18 previously archived CC BY photos are checked in the
          # *deployed website*, not merely by testing GitHub file existence.
          local_release=json.loads(Path("site/data/poaceae-release.json").read_text())
          assert release["photo_files_referenced_on_public_site"]==local_release["photo_files_referenced_on_public_site"],"Live Pages is behind current published release"
          assert release["photo_panels_visible"]==local_release["photo_panels_visible"]
          review=json.loads(Path("migration/reviewed-photo-level-ccby-20261029.json").read_text())
          assert len(review["entries"])==18
          reviewed_by_species={}
          for record in review["entries"]:
              sid=record["species_id"]
              reviewed_by_species.setdefault(sid,[]).append(record)
          assert {k:len(v) for k,v in reviewed_by_species.items()}=={
              "dichanthelium-lindheimeri":9,
              "dichanthelium-pedicellatum":5,
              "festuca-versuta":4
          }
          exact_checked=0
          for sid,entries in reviewed_by_species.items():
              card=json.loads(get(BASE+"data/species/"+sid+".json")[0])
              panels={p["src"].removeprefix("../"):p for p in card["panels"]}
              for row in entries:
                  path=row["path"]
                  panel=panels[path]
                  assert panel["photo_review_status"]=="EXACT_PHOTO_RECORD_ARCHIVED_20261026_27"
                  assert panel["source_page"]==row["source_page"]
                  assert panel["license"]=="CC BY"
                  assert "version not recorded" in panel.get("photo_license_note","").lower()
                  assert not panel.get("license_url"),"Do not invent a CC BY version"
                  source=urllib.parse.urljoin(BASE,panel["src"])
                  body,mime=get(source)
                  assert mime.lower().startswith("image/") and body==Path(path).read_bytes(),path
                  exact_checked+=1
          assert exact_checked==18
          # Full 112-species live gallery test, including every original JPEG,
          # credited source, author-only permission and comparison link.
          # These are already hosted files; no new photos are sourced.
          from concurrent.futures import ThreadPoolExecutor,as_completed
          from collections import Counter
          assert release["species_with_visible_photos"]==112
          assert release["species_with_target_species_source_photos"]==112
          gallery=json.loads(get(BASE+"data/gallery-index.json")[0])
          assert gallery["photo_species"]==112 and len(gallery["entries"])==112
          assert gallery["photo_panels"]==release["photo_panels_visible"]
          refs=set();counts=Counter();all_panels=0
          for row in index:
              sid=row["id"]
              card=json.loads(get(BASE+"data/species/"+sid+".json")[0])
              assert card["panels"],sid
              assert any(p.get("photo_role")=="TARGET_SPECIES_SOURCE"
                  and p.get("source_species_id")==sid for p in card["panels"]),sid
              assert gallery["entries"][sid]["count"]==len(card["panels"])
              all_panels+=len(card["panels"])
              for p in card["panels"]:
                  assert p.get("source_page","").startswith("https://"),(sid,p.get("label"))
                  assert p.get("creator") and p.get("license")
                  license_text=p["license"].lower()
                  assert "by-nc" not in license_text and "all rights reserved" not in license_text,(sid,license_text)
                  if "bob harms" in p["creator"].lower():
                      assert "not cc" in license_text
                      assert "educational" in p.get("photo_license_note","").lower()
                  sourcepath=p["src"].removeprefix("../")
                  assert Path(sourcepath).is_file(),sourcepath
                  refs.add(sourcepath)
                  counts[p.get("photo_review_status","OTHER")]+=1
          assert len(refs)==release["photo_files_referenced_on_public_site"]==486
          assert all_panels==release["photo_panels_visible"]==604
          def verify_image(path):
              url=urllib.parse.urljoin(BASE,"../"+path)
              for attempt in range(3):
                  try:
                      body,mime=get(url)
                      assert mime.lower().startswith("image/"),(path,mime)
                      assert body==Path(path).read_bytes(),path
                      return path
                  except Exception:
                      if attempt==2:raise
                      time.sleep(2)
          with ThreadPoolExecutor(max_workers=7) as executor:
              done=list(executor.map(verify_image,sorted(refs)))
          assert len(done)==486
          closeout=json.loads(Path("migration/curated-existing-grass-photo-closeout-20261029.json").read_text())
          assert len(closeout["entries"])==25
          assert all(r["src"] in refs for r in closeout["entries"])
          print("POACEAE_FULL_EXISTING_IMAGE_RELEASE_PASS",json.dumps({
              "species_with_own_species_source_photo":112,
              "unique_original_images_live_byte_identical":len(done),
              "teaching_panels":all_panels,
              "selected_narrow_author_or_archived_credits":len(closeout["entries"]),
              "individual_existing_ccby_photo_records":exact_checked,
              "new_external_photos":0
          },sort_keys=True))
          print("POACEAE_EXACT_PHOTO_RECOVERY_LIVE_PASS",json.dumps({
              "exact_individually_credited_ccby_photos":exact_checked,
              "review_species":sorted(reviewed_by_species),
              "current_published_photo_files":release["photo_files_referenced_on_public_site"],
              "current_teaching_panels":release["photo_panels_visible"],
              "original_image_bytes_matched":True,
              "new_media_collected":0
          },sort_keys=True))
          print("POACEAE_PUBLIC_PAGES_IMAGE_PASS",json.dumps({
              "species":112,"published_photo_files":release["photo_files_referenced_on_public_site"],
              "sampled_photographed_species_images_loaded":checked,
              "all_source_files_untouched":True,"new_external_photos_collected":0
          },sort_keys=True))
          PY
