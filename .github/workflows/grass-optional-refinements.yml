name: Grass Lab optional character refinements — source and exclusion QA
on:
  pull_request:
    paths:
      - 'site/visual-key-lab/index.html'
      - 'site/visual-key-lab/optional-refinement-evidence.json'
      - 'scripts/qa_optional_grass_refinements.py'
      - 'scripts/test_optional_grass_refinement.cjs'
      - 'scripts/test_grass_venation_field_guide.cjs'
      - 'scripts/test_grass_leaf_detail_field_guide.cjs'
      - 'scripts/test_grass_collar_sheath_field_guide.cjs'
      - 'scripts/test_grass_stem_field_guide.cjs'
      - 'scripts/test_grass_flower_spikelet_field_guide.cjs'
      - 'scripts/test_grass_guided_comparison.cjs'
      - '.github/workflows/grass-optional-refinements.yml'
  push:
    branches: [main]
    paths:
      - 'site/visual-key-lab/index.html'
      - 'site/visual-key-lab/optional-refinement-evidence.json'
      - 'scripts/qa_optional_grass_refinements.py'
      - 'scripts/test_optional_grass_refinement.cjs'
      - 'scripts/test_grass_venation_field_guide.cjs'
      - 'scripts/test_grass_leaf_detail_field_guide.cjs'
      - 'scripts/test_grass_collar_sheath_field_guide.cjs'
      - 'scripts/test_grass_stem_field_guide.cjs'
      - 'scripts/test_grass_flower_spikelet_field_guide.cjs'
      - 'scripts/test_grass_guided_comparison.cjs'
      - '.github/workflows/grass-optional-refinements.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  botanical-refinement-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source-backed states, original 112, research holds and unknown-safe sorting
        run: python3 scripts/qa_optional_grass_refinements.py
      - name: Exercise leaf-detail selections, inherited scoring and unknown-safe ranking
        run: node scripts/test_optional_grass_refinement.cjs
      - name: Verify seven vein and rib diagrams, accessibility and unchanged evidence
        run: node scripts/test_grass_venation_field_guide.cjs
      - name: Test leaf shape, width, tip, edge, midrib and hair diagrams
        run: node scripts/test_grass_leaf_detail_field_guide.cjs
      - name: Verify twenty-two collar, ligule and sheath field-guide sketches
        run: node scripts/test_grass_collar_sheath_field_guide.cjs
      - name: Verify stem, runner, rhizome, crown and node diagrams
        run: node scripts/test_grass_stem_field_guide.cjs
      - name: Test 26 flower and spikelet structure sketches without changing species scores
        run: node scripts/test_grass_flower_spikelet_field_guide.cjs
      - name: Verify novice comparison with source-backed differences and unknown-safe states
        run: node scripts/test_grass_guided_comparison.cjs
