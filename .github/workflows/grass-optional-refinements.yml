name: Grass Lab optional character refinements — source and exclusion QA
on:
  pull_request:
    paths:
      - 'site/visual-key-lab/index.html'
      - 'site/visual-key-lab/optional-refinement-evidence.json'
      - 'scripts/qa_optional_grass_refinements.py'
      - 'scripts/test_grass_backlog_d_primary_344.cjs'
      - 'scripts/test_grass_backlog_bc_primary_344.cjs'
      - 'scripts/test_grass_backlog_floral_344.cjs'
      - 'scripts/test_grass_backlog_numeric_344.cjs'
      - 'scripts/test_grass_backlog_ad_vegetative_344.cjs'
      - 'scripts/test_grass_backlog_supp_veg_344.cjs'
      - 'scripts/test_grass_backlog_supp_floral_344.cjs'
      - 'scripts/test_grass_backlog_conditional_measurements_344.cjs'
      - 'scripts/test_grass_backlog_organs_344.cjs'
      - 'scripts/test_grass_backlog_b18_344.cjs'
      - 'scripts/test_grass_backlog_final_primary_344.cjs'
      - 'scripts/test_optional_grass_refinement.cjs'
      - 'scripts/test_grass_venation_field_guide.cjs'
      - 'scripts/test_grass_leaf_detail_field_guide.cjs'
      - 'scripts/test_grass_collar_sheath_field_guide.cjs'
      - 'scripts/test_grass_stem_field_guide.cjs'
      - 'scripts/test_grass_flower_spikelet_field_guide.cjs'
      - 'scripts/test_grass_guided_comparison.cjs'
      - 'scripts/test_grass_compare_photo_quality.cjs'
      - 'scripts/test_grass_archive_photo_reuse.cjs'
      - 'site/visual-key-lab/photo-general-archive-extras.json'
      - '.github/workflows/grass-optional-refinements.yml'
  push:
    branches: [main]
    paths:
      - 'site/visual-key-lab/index.html'
      - 'site/visual-key-lab/optional-refinement-evidence.json'
      - 'scripts/qa_optional_grass_refinements.py'
      - 'scripts/test_optional_grass_refinement.cjs'
      - 'scripts/test_grass_venation_field_guide.cjs'
      - 'scripts/test_grass_leaf_detail_field_guide.cjs'
      - 'scripts/test_grass_collar_sheath_field_guide.cjs'
      - 'scripts/test_grass_stem_field_guide.cjs'
      - 'scripts/test_grass_flower_spikelet_field_guide.cjs'
      - 'scripts/test_grass_guided_comparison.cjs'
      - 'scripts/test_grass_compare_photo_quality.cjs'
      - 'scripts/test_grass_archive_photo_reuse.cjs'
      - 'site/visual-key-lab/photo-general-archive-extras.json'
      - '.github/workflows/grass-optional-refinements.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  botanical-refinement-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source-backed states, original 112, research holds and unknown-safe sorting
        run: python3 scripts/qa_optional_grass_refinements.py
      - name: Verify 16 organ- and sex-specific Flora/supplemental clues
        run: node scripts/test_grass_backlog_organs_344.cjs
      - name: Protect Lane B18 sterile-versus-fertile lemma hairs and blocked awns
        run: node scripts/test_grass_backlog_b18_344.cjs
      - name: Validate final A/C/D primary records, source conflicts and protected holds
        run: node scripts/test_grass_backlog_final_primary_344.cjs
      - name: Check 24 supplemental measured attributes and boundary holds
        run: node scripts/test_grass_backlog_conditional_measurements_344.cjs
      - name: Verify 149 supplemental reproductive citations and anatomy holds
        run: node scripts/test_grass_backlog_supp_floral_344.cjs
      - name: Verify 69 conditional published treatments, source links and holds
        run: node scripts/test_grass_backlog_supp_veg_344.cjs
      - name: Validate 75 A/D vegetative source pages and protected conflicts
        run: node scripts/test_grass_backlog_ad_vegetative_344.cjs
      - name: Test 44 source-measured width and ligule states against numeric bins
        run: node scripts/test_grass_backlog_numeric_344.cjs
      - name: Check 65 verified Flora reproductive records and anatomy safeguards
        run: node scripts/test_grass_backlog_floral_344.cjs
      - name: Verify 87 B/C primary leaf, sheath and stem source-page mappings
        run: node scripts/test_grass_backlog_bc_primary_344.cjs
      - name: Verify 51 Lane D source-page character records and protected holds
        run: node scripts/test_grass_backlog_d_primary_344.cjs
      - name: Exercise leaf-detail selections, inherited scoring and unknown-safe ranking
        run: node scripts/test_optional_grass_refinement.cjs
      - name: Verify seven vein and rib diagrams, accessibility and unchanged evidence
        run: node scripts/test_grass_venation_field_guide.cjs
      - name: Test leaf shape, width, tip, edge, midrib and hair diagrams
        run: node scripts/test_grass_leaf_detail_field_guide.cjs
      - name: Verify twenty-two collar, ligule and sheath field-guide sketches
        run: node scripts/test_grass_collar_sheath_field_guide.cjs
      - name: Verify stem, runner, rhizome, crown and node diagrams
        run: node scripts/test_grass_stem_field_guide.cjs
      - name: Test 26 flower and spikelet structure sketches without changing species scores
        run: node scripts/test_grass_flower_spikelet_field_guide.cjs
      - name: Verify novice comparison with source-backed differences and unknown-safe states
        run: node scripts/test_grass_guided_comparison.cjs
      - name: Review scored and trial comparison photos without duplicating or promoting held images
        run: node scripts/test_grass_compare_photo_quality.cjs
      - name: Verify archived public-domain whole-flowering photo reuse and source credits
        run: node scripts/test_grass_archive_photo_reuse.cjs
