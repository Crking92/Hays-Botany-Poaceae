    branches: [main]
    paths:
      - 'site/visual-key-lab/index.html'
      - 'site/visual-key-lab/optional-refinement-evidence.json'
      - 'site/visual-key-lab/optional-evidence-targeted-20261116.json'
      - 'scripts/test_grass_targeted_advanced_evidence.cjs'
