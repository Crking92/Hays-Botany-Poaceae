name: Grass Lab optional character refinements — source and exclusion QA
on:
  pull_request:
    paths:
      - 'site/visual-key-lab/index.html'
      - 'site/visual-key-lab/optional-refinement-evidence.json'
      - 'scripts/qa_optional_grass_refinements.py'
      - '.github/workflows/grass-optional-refinements.yml'
  push:
    branches: [main]
    paths:
      - 'site/visual-key-lab/index.html'
      - 'site/visual-key-lab/optional-refinement-evidence.json'
      - 'scripts/qa_optional_grass_refinements.py'
      - '.github/workflows/grass-optional-refinements.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  botanical-refinement-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source-backed states, original 112, research holds and unknown-safe sorting
        run: python3 scripts/qa_optional_grass_refinements.py
