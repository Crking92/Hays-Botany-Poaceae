name: Publish 3 UT PRC authorized Bob Harms KR bluestem anatomy photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-ut-prc-harms-kr-20261104.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: poaceae-ut-prc-kr-permission-20261104
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image verification dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Download exact authorized originals and publish without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          published=0
          for attempt in $(seq 1 8); do
            git fetch origin main
            git checkout -B main origin/main
            python scripts/publish_ut_prc_harms_kr_20261104.py
            git add content/taxa/Poaceae/Bothriochloa/bothriochloa-ischaemum/ site/data/species/bothriochloa-ischaemum.json site/data/gallery-index.json migration/ut-prc-bob-harms-kr-permission-20261102.json
            git diff --cached --check
            if git diff --cached --quiet; then echo "Already committed by a previous run"; published=1; break; fi
            git commit -m "Publish 3 UT PRC-permitted Bob Harms KR bluestem anatomical originals and visible credits"
            if git push origin HEAD:main; then
              echo "UT_PRC_KR_3_ORIGINALS_COMMITTED"
              published=1
              break
            fi
            echo "Publisher changed Poaceae main concurrently; retry $attempt"
            sleep 3
          done
          test "$published" -eq 1
      - name: Request public Pages regeneration after GitHub Actions bot commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${{ github.repository }}/pages/builds" || true
      - name: Confirm all three photographs AND attributed card on actual live public Pages
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,time,urllib.request
          base="https://crking92.github.io/Hays-Botany-Poaceae/"
          expected=json.load(open("migration/ut-prc-bob-harms-kr-permission-20261102.json"))["images"]
          assert len(expected)==3
          for attempt in range(1,25):
              try:
                  card=json.load(urllib.request.urlopen(base+"site/data/species/bothriochloa-ischaemum.json?verified="+str(attempt),timeout=25))
                  public={p.get("src"):p for p in card["panels"]}
                  for item in expected:
                      src=item["site_src"]
                      if src not in public: raise AssertionError("Missing from public species card: "+src)
                      p=public[src]
                      assert "Harms" in p["creator"] and "UT Plant Resources Center" in p["license"]
                      assert "NOT Creative Commons" in p["license"]
                      url=base+item["installed_file"]
                      req=urllib.request.Request(url+"?verified="+str(attempt),headers={"User-Agent":"HaysBotanyPublicPhotoAudit/1.0"})
                      content=urllib.request.urlopen(req,timeout=25).read()
                      assert hashlib.sha256(content).hexdigest()==item["sha256"],"Public image bytes differ: "+url
                  print("ALL_THREE_HARMS_KR_PHOTOS_LIVE_WITH_CORRECT_CREDITS",len(expected),flush=True)
                  break
              except Exception as exc:
                  if attempt==24: raise
                  print("PUBLIC_SITE_AWAITING_DEPLOY",attempt,str(exc)[:200],flush=True)
                  time.sleep(20)
          PY
