name: Canter windmillgrass Gould comparison
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  canter-windmill-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_canter_windmill_gould.cjs
      - run: node scripts/test_grass_gould_1975_reference.cjs
      - run: node scripts/test_kr_gould_character_mapping.cjs
      - run: node scripts/test_grass_three_way_evidence_key.cjs

